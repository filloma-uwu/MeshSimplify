<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PQSS 代理 Mesh</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      --bg: #121518;
      --panel: rgba(24, 28, 32, 0.96);
      --line: #3a4248;
      --muted: #a8b0b6;
      --text: #f4f6f7;
      --accent: #49b894;
      --warning: #f0b45a;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, select, input { font: inherit; }
    button, select {
      min-height: 32px;
      color: var(--text);
      background: #272d31;
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    button { cursor: pointer; padding: 5px 10px; }
    button:hover { border-color: #6d787f; background: #30373c; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    button:disabled { opacity: 0.38; cursor: default; }
    #viewport { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #topbar {
      position: fixed;
      z-index: 5;
      top: 0;
      left: 0;
      right: 0;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(17, 20, 23, 0.95);
      backdrop-filter: blur(8px);
    }
    .brand { font-size: 15px; font-weight: 700; white-space: nowrap; }
    .model-nav { display: flex; align-items: center; gap: 6px; }
    .icon-button {
      width: 32px;
      padding: 0;
      font-size: 17px;
      line-height: 1;
    }
    #modelSelect { width: 150px; padding: 4px 28px 4px 8px; }
    .modes {
      display: flex;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
    }
    .modes button {
      min-height: 30px;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      white-space: nowrap;
    }
    .modes button:last-child { border-right: 0; }
    .modes button.active { color: #07140f; background: var(--accent); }
    #fitButton { margin-left: auto; }
    #panel {
      position: fixed;
      z-index: 4;
      top: 64px;
      right: 12px;
      width: min(300px, calc(100vw - 24px));
      max-height: calc(100vh - 78px);
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    }
    .section { padding: 0 0 13px; margin: 0 0 13px; border-bottom: 1px solid var(--line); }
    .section:last-child { padding: 0; margin: 0; border-bottom: 0; }
    .section-title {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .check-row { display: flex; gap: 14px; flex-wrap: wrap; }
    label { color: var(--muted); }
    label.check { display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
    input[type="checkbox"] { accent-color: var(--accent); }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .primitive-navigation { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; margin-top: 8px; }
    #primitiveSelect { width: 100%; min-width: 0; padding: 4px 8px; }
    #nextPrimitiveButton { white-space: nowrap; }
    .regenerate-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
    #maximumErrorInput {
      width: 100%; min-width: 0; min-height: 32px; padding: 5px 8px;
      color: var(--text); background: #202529; border: 1px solid var(--line);
      border-radius: 4px; font-variant-numeric: tabular-nums;
    }
    #regenerateStatus { min-height: 18px; margin-top: 6px; color: var(--muted); }
    .inspection-grid { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 6px; align-items: center; }
    .inspection-grid input, .inspection-grid select {
      width: 100%; min-width: 0; min-height: 32px; padding: 5px 8px;
      color: var(--text); background: #202529; border: 1px solid var(--line); border-radius: 4px;
      font-variant-numeric: tabular-nums;
    }
    #halfedgeStats { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; margin-top: 9px; }
    #halfedgeStats dt { color: var(--muted); }
    #halfedgeStats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .range-head { display: flex; justify-content: space-between; margin-bottom: 3px; }
    #stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; }
    #stats dt { margin: 0; color: var(--muted); }
    #stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    .valid { color: var(--accent); }
    .invalid { color: var(--warning); }
    #legend { display: grid; grid-template-columns: 12px 1fr auto; gap: 7px 8px; align-items: center; }
    .swatch { width: 12px; height: 12px; border-radius: 2px; }
    .legend-count { color: var(--muted); font-variant-numeric: tabular-nums; }
    #labels {
      position: fixed;
      z-index: 3;
      left: 14px;
      bottom: 12px;
      display: none;
      width: calc(100vw - 340px);
      pointer-events: none;
      color: #dce1e4;
      font-size: 12px;
      text-transform: uppercase;
    }
    #labels.visible { display: flex; }
    #labels span { width: 50%; text-align: center; }
    #loading {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(12, 14, 16, 0.78);
      font-size: 14px;
    }
    #loading.hidden { display: none; }
    #error { color: #ff9188; max-width: 560px; padding: 20px; white-space: pre-wrap; }
    @media (max-width: 850px) {
      #topbar { flex-wrap: wrap; padding: 7px 8px; }
      .brand { width: calc(100% - 42px); }
      #fitButton { position: absolute; right: 8px; top: 7px; }
      .model-nav { width: 100%; }
      #modelSelect { flex: 1; min-width: 0; }
      .modes { width: 100%; overflow-x: auto; }
      .modes button { flex: 1 0 auto; }
      #panel {
        top: auto;
        bottom: 8px;
        left: 8px;
        right: 8px;
        width: auto;
        max-height: min(42vh, 340px);
        padding: 11px;
      }
      #labels { left: 8px; bottom: calc(min(42vh, 340px) + 18px); width: calc(100vw - 16px); }
    }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <header id="topbar">
    <div class="brand">阶段 1 / 阶段 2 检查</div>
    <div class="model-nav">
      <button id="previousButton" class="icon-button" title="上一个模型" aria-label="上一个模型">&larr;</button>
      <select id="modelSelect" aria-label="模型"></select>
      <button id="nextButton" class="icon-button" title="下一个模型" aria-label="下一个模型">&rarr;</button>
    </div>
    <div class="modes" aria-label="查看模式">
      <button data-mode="source">原模型</button>
      <button data-mode="phase0">阶段 0：原始 OBJ 开放洞覆盖</button>
      <button data-mode="phase1">阶段 1：填洞结果</button>
      <button data-mode="phase2">阶段 2：保守外扩</button>
      <button data-mode="phase3">阶段 3：面数最小化</button>
      <button data-mode="phase4">阶段 4：三角化</button>
      <button data-mode="error">误差位置</button>
      <button data-mode="split" class="active">原始/最终对比</button>
    </div>
    <button id="fitButton" title="使模型适应当前视图">适应视图</button>
  </header>

  <aside id="panel">
    <section class="section">
      <h2 class="section-title">阶段 1 半边逐项检查</h2>
      <div class="inspection-grid">
        <label for="inspectionStage">检查对象</label>
        <select id="inspectionStage"><option value="phase1">阶段 1 半边</option><option value="phase2">阶段 2 半边</option></select>
        <span></span><span></span>
        <label for="halfedgeFilter">筛选</label>
        <select id="halfedgeFilter"><option value="all">全部半边</option><option value="unpaired">无对边</option></select>
        <button id="previousHalfedgeButton" type="button" title="当前面上一条半边">←</button>
        <button id="nextHalfedgeButton" type="button" title="当前面下一条半边">→</button>
        <label for="halfedgeInput">边 ID</label>
        <input id="halfedgeInput" type="number" min="0" step="1" inputmode="numeric">
        <button id="inspectOppositeButton" type="button" title="跳转到当前半边的对边">对边</button>
        <button id="inspectHalfedgeButton" type="button">查看</button>
        <label for="faceInput">面 ID</label>
        <input id="faceInput" type="number" min="0" step="1" inputmode="numeric">
        <button id="previousFaceButton" type="button" title="上一面">←</button>
        <button id="nextFaceButton" type="button" title="下一面">→</button>
      </div>
      <div style="margin-top:7px;color:var(--muted)">Shift + 单击当前半边表面可直接选择面。</div>
      <dl id="halfedgeStats"></dl>
    </section>
    <section class="section">
      <h2 class="section-title">图元类型</h2>
      <div class="check-row">
        <label class="check"><input type="checkbox" data-type="polygon" checked>多边形</label>
        <label class="check"><input type="checkbox" data-type="disk" checked>圆盘</label>
        <label class="check"><input type="checkbox" data-type="annulus" checked>圆环面</label>
        <label class="check"><input type="checkbox" data-type="cylindricalband" checked>圆柱面</label>
        <label class="check"><input type="checkbox" data-type="conicalband" checked>圆锥面</label>
      </div>
      <div class="primitive-navigation">
        <select id="primitiveSelect" aria-label="选中的代理部件"><option value="all">全部代理部件</option></select>
        <button id="nextPrimitiveButton" type="button" title="前往下一个图元">下一个图元 →</button>
      </div>
    </section>
    <section class="section">
      <div class="range-head"><label for="opacity">结果不透明度</label><output id="opacityValue">100%</output></div>
      <input id="opacity" type="range" min="10" max="100" value="100">
      <div class="range-head" style="margin-top:10px"><label for="otherOpacity">其他图元不透明度</label><output id="otherOpacityValue">15%</output></div>
      <input id="otherOpacity" type="range" min="0" max="100" value="15">
      <label class="check" style="margin-top:8px"><input id="wireframe" type="checkbox">线框</label>
    </section>
    <section id="phase2RoundSection" class="section" hidden>
      <h2 class="section-title">阶段 2 外扩轮次</h2>
      <div class="primitive-navigation">
        <button id="previousPhase2RoundButton" type="button">上一轮</button>
        <button id="nextPhase2RoundButton" type="button">下一轮</button>
      </div>
      <dl id="phase2RoundStats" style="display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-top:9px"></dl>
    </section>
    <section class="section">
      <h2 class="section-title">最大误差约束</h2>
      <label for="maximumErrorInput">模型单位</label>
      <div class="regenerate-row">
        <input id="maximumErrorInput" type="number" min="0" step="any" inputmode="decimal" aria-label="最大误差">
        <button id="regenerateButton" type="button">重新生成</button>
      </div>
      <div id="regenerateStatus"></div>
    </section>
    <section class="section">
      <h2 class="section-title">模型统计</h2>
      <dl id="stats"></dl>
    </section>
    <section id="errorSection" class="section" hidden>
      <h2 class="section-title">误差认证（阶段 2 → 阶段 1）</h2>
      <div id="legend">
        <span class="swatch" style="background:#ffb33c"></span><span>最大观测误差代理点</span><span></span>
        <span class="swatch" style="background:#43d6db"></span><span>最近填洞后表面点</span><span></span>
      </div>
      <button id="focusErrorButton" type="button" style="width:100%;margin-top:10px">定位最大误差</button>
    </section>
    <section class="section">
      <h2 class="section-title">选中的代理部件</h2>
      <dl id="primitiveStats"></dl>
    </section>
  </aside>

  <div id="labels"><span id="sourceComparisonLabel">原模型</span><span id="comparisonLabel">阶段 4：三角化结果</span></div>
  <div id="loading"><div id="loadingText">正在加载分析结果...</div></div>

  <script type="importmap">
    { "imports": { "three": "./lib/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from './lib/three.module.js';
    import { OrbitControls } from './lib/OrbitControls.js';

    const params = new URLSearchParams(location.search);
    const manifestUrl = new URL(params.get('manifest') || '/outputs/direct_coverage_uniform_closed_responsibility_full_v13/viewer_manifest.json', location.href);
    document.querySelector('#wireframe').checked = ['1', 'true', 'yes'].includes(
      (params.get('wireframe') || '').toLowerCase());
    const viewport = document.querySelector('#viewport');
    const loading = document.querySelector('#loading');
    const loadingText = document.querySelector('#loadingText');
    const modelSelect = document.querySelector('#modelSelect');
    const primitiveSelect = document.querySelector('#primitiveSelect');
    const statsElement = document.querySelector('#stats');
    const primitiveStatsElement = document.querySelector('#primitiveStats');
    const maximumErrorInput = document.querySelector('#maximumErrorInput');
    const regenerateButton = document.querySelector('#regenerateButton');
    const regenerateStatus = document.querySelector('#regenerateStatus');
    const labels = document.querySelector('#labels');
    const halfedgeStatsElement = document.querySelector('#halfedgeStats');
    let halfedgeInspection = null;
    const halfedgeInspections = { phase1: null, phase2: null };
    let inspectionRole = 'phase1';
    let halfedgeOverlay = null;
    let currentMetadataUrl = null;
    let phase2RoundRecords = [];
    let currentPhase2Round = null;
    let phase2RoundCache = new Map();

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(1);
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x121518, 1);
    viewport.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.01, 1e12);
    camera.up.set(0, 0, 1);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = true;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x293138, 1.45));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(2, -3, 5);
    scene.add(keyLight);

    const roots = {
      source: new THREE.Group(),
      phase0: new THREE.Group(),
      phase1: new THREE.Group(),
      phase2: new THREE.Group(),
      phase3: new THREE.Group(),
      phase4: new THREE.Group(),
      error: new THREE.Group(),
    };
    Object.values(roots).forEach(root => scene.add(root));
    const inspectionRoot = new THREE.Group();
    inspectionRoot.name = 'halfedge_inspection';
    scene.add(inspectionRoot);

    let manifest;
    let metadata;
    let currentModel;
    let mode = 'split';
    let selectedPrimitive = 'all';
    let fitPending = true;
    let renderDirty = true;
    let loadGeneration = 0;
    let openError = null;
    const batchedPrimitiveData = {
      phase0: new Map(),
      phase1: new Map(),
      phase2: new Map(),
      phase3: new Map(),
      phase4: new Map(),
    };
    const primitiveTypes = ['polygon', 'disk', 'annulus', 'cylindricalband', 'conicalband'];
    const primitiveTypeNames = {
      polygon: '平面多边形', disk: '圆盘', annulus: '圆环面',
      cylindricalband: '圆柱面', conicalband: '圆锥面',
    };
    const enabledTypes = new Set(primitiveTypes);
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    controls.addEventListener('change', () => { renderDirty = true; });

    const palette = [
      0x49b894, 0xe4aa55, 0x5fa8d3, 0xe46f61, 0xa48ad4, 0x8fc66b,
      0xd47ba8, 0x5bc2c8, 0xd4cc66, 0x7897e0, 0xec8f4d, 0x70c08b,
    ];

    function colorFor(id) {
      const base = new THREE.Color(palette[id % palette.length]);
      const cycle = Math.floor(id / palette.length) % 3;
      if (cycle === 1) base.offsetHSL(0.025, -0.05, -0.08);
      if (cycle === 2) base.offsetHSL(-0.025, 0.02, 0.08);
      return base;
    }

    function attachTriangleWireframe(mesh) {
      const geometry = new THREE.WireframeGeometry(mesh.geometry);
      const material = new THREE.LineBasicMaterial({
        color: 0xffd54f, transparent: true, opacity: 1.0,
        depthTest: true, depthWrite: false,
      });
      const wireframe = new THREE.LineSegments(geometry, material);
      wireframe.userData.triangleWireframe = true;
      wireframe.renderOrder = 2;
      mesh.add(wireframe);
    }

    function ensureOccludedWireframe(mesh) {
      let wireframe = mesh.children.find(child => child.userData.occludedWireframe);
      if (wireframe) return wireframe;
      const material = new THREE.MeshBasicMaterial({
        color: 0xffd54f,
        wireframe: true,
        transparent: true,
        opacity: 1.0,
        depthTest: true,
        depthWrite: false,
        side: THREE.DoubleSide,
      });
      // Share the indexed surface buffer. The parent performs a colorless
      // depth pre-pass; this child then draws only fragments on visible
      // surfaces, so back-side/internal triangle edges cannot bleed through.
      wireframe = new THREE.Mesh(mesh.geometry, material);
      wireframe.userData.occludedWireframe = true;
      wireframe.userData.sharedGeometry = true;
      wireframe.visible = false;
      wireframe.renderOrder = 2;
      wireframe.raycast = () => {};
      mesh.add(wireframe);
      return wireframe;
    }

    function clearHalfedgeInspection() {
      for (const child of [...inspectionRoot.children]) {
        inspectionRoot.remove(child);
        child.traverse(object => {
          object.geometry?.dispose();
          const materials = Array.isArray(object.material)
            ? object.material : [object.material];
          for (const material of materials) material?.dispose?.();
        });
      }
      halfedgeStatsElement.replaceChildren();
      halfedgeOverlay = null;
    }

    function inspectionPoint(vertex) {
      const data = halfedgeInspection;
      return new THREE.Vector3(
        data.positions[3 * vertex], data.positions[3 * vertex + 1], data.positions[3 * vertex + 2]);
    }

    function inspectionRow(label, value) {
      statRow(label, String(value), '', halfedgeStatsElement);
    }

    function formatVector(vector) {
      return [vector.x, vector.y, vector.z]
        .map(value => Number(value).toFixed(6)).join(', ');
    }

    function faceVertices(faceId) {
      const data = halfedgeInspection;
      return [
        data.indices[3 * faceId],
        data.indices[3 * faceId + 1],
        data.indices[3 * faceId + 2],
      ];
    }

    function faceNormal(faceId) {
      const vertices = faceVertices(faceId).map(inspectionPoint);
      return vertices[1].clone().sub(vertices[0]).cross(
        vertices[2].clone().sub(vertices[0])).normalize();
    }

    function faceCenter(faceId) {
      const vertices = faceVertices(faceId).map(inspectionPoint);
      return vertices[0].clone().add(vertices[1]).add(vertices[2]).multiplyScalar(1 / 3);
    }

    function faceScale(faceId) {
      const vertices = faceVertices(faceId).map(inspectionPoint);
      return Math.max(
        vertices[0].distanceTo(vertices[1]),
        vertices[1].distanceTo(vertices[2]),
        vertices[2].distanceTo(vertices[0]),
        1e-6);
    }

    function addInspectionArrow(origin, direction, length, color, renderOrder = 206) {
      if (!(length > 0) || direction.lengthSq() <= 0) return null;
      const arrow = new THREE.ArrowHelper(
        direction.clone().normalize(), origin, length, color,
        Math.min(Math.max(length * 0.22, 4), 24),
        Math.min(Math.max(length * 0.12, 2), 12));
      arrow.renderOrder = renderOrder;
      arrow.traverse(object => {
        if (!object.material) return;
        object.material.depthTest = false;
        object.material.depthWrite = false;
      });
      inspectionRoot.add(arrow);
      return arrow;
    }

    function addFaceNormalArrow(faceId, color = 0x66ff8a, lengthScale = 0.75) {
      const normal = faceNormal(faceId);
      addInspectionArrow(faceCenter(faceId), normal, faceScale(faceId) * lengthScale, color);
      return normal;
    }

    function showHalfedgeSummary() {
      clearHalfedgeInspection();
      const data = halfedgeInspection;
      if (!data) {
        inspectionRow('状态', '未加载 Halfedge');
        return;
      }
      let unpaired = 0;
      for (let id = 0; id < data.halfedgeCount; ++id)
        if (data.halfedges[id * 4 + 3] === 0xffffffff) ++unpaired;
      inspectionRow('vertices', data.vertexCount.toLocaleString());
      inspectionRow('faces', data.faceCount.toLocaleString());
      inspectionRow('halfedges', data.halfedgeCount.toLocaleString());
      inspectionRow('无 opposite', unpaired.toLocaleString());
    }

    function setInspectionRole(role, updateMode = true) {
      if (!Object.prototype.hasOwnProperty.call(halfedgeInspections, role)) return;
      clearHalfedgeInspection();
      inspectionRole = role;
      halfedgeInspection = halfedgeInspections[role];
      document.querySelector('#inspectionStage').value = role;
      document.querySelector('#halfedgeInput').max = Math.max(0,
        (halfedgeInspection?.halfedgeCount || 1) - 1);
      document.querySelector('#faceInput').max = Math.max(0,
        (halfedgeInspection?.faceCount || 1) - 1);
      params.set('inspect', role);
      showHalfedgeSummary();
      if (updateMode && halfedgeInspection) setMode(role);
    }

    function highlightFace(faceId, includeStats = true) {
      const data = halfedgeInspection;
      if (!data || !Number.isInteger(faceId) || faceId < 0 || faceId >= data.faceCount) {
        clearHalfedgeInspection();
        inspectionRow('错误', `face ID 必须在 0..${Math.max(0, (data?.faceCount || 1) - 1)}`);
        return false;
      }
      clearHalfedgeInspection();
      const vertices = faceVertices(faceId);
      const geometry = new THREE.BufferGeometry().setFromPoints(vertices.map(inspectionPoint));
      geometry.setIndex([0, 1, 2]);
      geometry.computeVertexNormals();
      const face = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({
        color: 0xff4f3d, transparent: true, opacity: 0.72, side: THREE.DoubleSide,
        depthTest: false, depthWrite: false,
      }));
      face.renderOrder = 200;
      inspectionRoot.add(face);
      const boundary = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(vertices.map(inspectionPoint)),
        new THREE.LineBasicMaterial({ color: 0xffe36a, depthTest: false, depthWrite: false }));
      boundary.renderOrder = 201;
      inspectionRoot.add(boundary);
      const normal = addFaceNormalArrow(faceId, 0x66ff8a);
      if (includeStats) {
        const firstHalfedge = data.faceHalfedges[faceId];
        inspectionRow('face', faceId);
        inspectionRow('vertices', vertices.join(', '));
        inspectionRow('face normal', formatVector(normal));
        inspectionRow('face_halfedge', firstHalfedge);
        inspectionRow('halfedge cycle', [firstHalfedge,
          data.halfedges[firstHalfedge * 4 + 2],
          data.halfedges[data.halfedges[firstHalfedge * 4 + 2] * 4 + 2]].join(' → '));
        document.querySelector('#faceInput').value = faceId;
        params.set('face', faceId);
        params.delete('halfedge');
        history.replaceState(null, '', `${location.pathname}?${params}`);
      }
      halfedgeOverlay = { type: 'face', id: faceId };
      renderDirty = true;
      return true;
    }

    function highlightHalfedge(halfedgeId) {
      const data = halfedgeInspection;
      if (!data || !Number.isInteger(halfedgeId) || halfedgeId < 0 ||
          halfedgeId >= data.halfedgeCount) {
        clearHalfedgeInspection();
        inspectionRow('错误', `halfedge ID 必须在 0..${Math.max(0, (data?.halfedgeCount || 1) - 1)}`);
        return false;
      }
      const base = halfedgeId * 4;
      const origin = data.halfedges[base];
      const faceId = data.halfedges[base + 1];
      const next = data.halfedges[base + 2];
      const opposite = data.halfedges[base + 3];
      if (!highlightFace(faceId, false)) return false;
      const destination = data.halfedges[next * 4];
      const start = inspectionPoint(origin);
      const end = inspectionPoint(destination);
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([start, end]),
        new THREE.LineBasicMaterial({ color: 0x36e6ff, depthTest: false, depthWrite: false }));
      line.renderOrder = 203;
      inspectionRoot.add(line);
      const direction = end.clone().sub(start);
      const length = direction.length();
      if (length > 0) {
        addInspectionArrow(start, direction, length, 0x36e6ff, 204);
      }
      const originMarker = new THREE.Points(
        new THREE.BufferGeometry().setFromPoints([start]),
        new THREE.PointsMaterial({ color: 0x66ff8a, size: 11, sizeAttenuation: false,
          depthTest: false, depthWrite: false }));
      originMarker.renderOrder = 205;
      inspectionRoot.add(originMarker);
      const destinationMarker = new THREE.Points(
        new THREE.BufferGeometry().setFromPoints([end]),
        new THREE.PointsMaterial({ color: 0xff70d7, size: 11, sizeAttenuation: false,
          depthTest: false, depthWrite: false }));
      destinationMarker.renderOrder = 205;
      inspectionRoot.add(destinationMarker);
      const currentNormal = faceNormal(faceId);
      const edgeDirection = end.clone().sub(start).normalize();
      let signedSine = null;
      let normalDot = null;
      if (opposite !== 0xffffffff) {
        const oppositeFace = data.halfedges[opposite * 4 + 1];
        const oppositeNormal = addFaceNormalArrow(oppositeFace, 0xff70d7, 0.65);
        signedSine = edgeDirection.dot(currentNormal.clone().cross(oppositeNormal));
        normalDot = currentNormal.dot(oppositeNormal);
      }
      inspectionRow('halfedge', halfedgeId);
      inspectionRow('origin → destination', `${origin} → ${destination}`);
      inspectionRow('face', faceId);
      inspectionRow('face normal', formatVector(currentNormal));
      inspectionRow('edge direction', formatVector(edgeDirection));
      inspectionRow('next', next);
      inspectionRow('opposite', opposite === 0xffffffff ? 'INVALID (unpaired)' : opposite);
      if (opposite !== 0xffffffff) {
        inspectionRow('opposite face', data.halfedges[opposite * 4 + 1]);
        inspectionRow('opposite normal',
          formatVector(faceNormal(data.halfedges[opposite * 4 + 1])));
        inspectionRow('dihedral signed sine', signedSine.toFixed(12));
        inspectionRow('normal dot', normalDot.toFixed(12));
      }
      document.querySelector('#halfedgeInput').value = halfedgeId;
      document.querySelector('#faceInput').value = faceId;
      params.set('halfedge', halfedgeId);
      params.delete('face');
      history.replaceState(null, '', `${location.pathname}?${params}`);
      halfedgeOverlay = { type: 'halfedge', id: halfedgeId };
      renderDirty = true;
      return true;
    }

    function adjacentInspectableHalfedge(offset) {
      const data = halfedgeInspection;
      if (!data) return;
      const filter = document.querySelector('#halfedgeFilter').value;
      let current = Number(document.querySelector('#halfedgeInput').value);
      if (!Number.isInteger(current)) current = offset > 0 ? -1 : 0;
      for (let attempt = 0; attempt < data.halfedgeCount; ++attempt) {
        current = (current + offset + data.halfedgeCount) % data.halfedgeCount;
        const unpaired = data.halfedges[current * 4 + 3] === 0xffffffff;
        if (filter === 'all' || unpaired) { highlightHalfedge(current); return; }
      }
      clearHalfedgeInspection();
      inspectionRow('筛选结果', '无匹配 halfedge');
      renderDirty = true;
    }

    function addOpenErrorVisualization(data) {
      openError = data;
      if (!data) return;
      const boundary = data.boundary_points || [];
      const pair = data.maximum_pair;
      const modelBox = new THREE.Box3();
      modelBox.expandByObject(roots.phase1);
      modelBox.expandByObject(roots.phase4);
      const modelScale = Math.max(modelBox.getSize(new THREE.Vector3()).length(), 1e-6);
      if (boundary.length) {
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(boundary.flat(), 3));
        const material = new THREE.PointsMaterial({
          color: 0xef5b43, size: modelScale * 0.002, sizeAttenuation: true,
          transparent: true, opacity: 0.34, depthWrite: false,
        });
        const points = new THREE.Points(geometry, material);
        points.name = 'open_error_boundary';
        points.renderOrder = 5;
        roots.error.add(points);
      }
      if (!pair || !(Number(pair.distance) > 0) ||
          !Array.isArray(pair.proxy) || !Array.isArray(pair.source)) return;
      const lineGeometry = new THREE.BufferGeometry();
      lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute([
        0, -1, 0,  1, -1, 0,  1, 1, 0,
        0, -1, 0,  1,  1, 0,  0, 1, 0,
      ], 3));
      const lineMaterial = new THREE.ShaderMaterial({
        uniforms: {
          startPoint: { value: new THREE.Vector3().fromArray(pair.proxy) },
          endPoint: { value: new THREE.Vector3().fromArray(pair.source) },
          resolution: { value: new THREE.Vector2(renderer.domElement.width, renderer.domElement.height) },
          lineWidthPixels: { value: 6 },
          lineColor: { value: new THREE.Color(0xffe26a) },
        },
        vertexShader: `
          uniform vec3 startPoint;
          uniform vec3 endPoint;
          uniform vec2 resolution;
          uniform float lineWidthPixels;
          void main() {
            vec4 startClip = projectionMatrix * modelViewMatrix * vec4(startPoint, 1.0);
            vec4 endClip = projectionMatrix * modelViewMatrix * vec4(endPoint, 1.0);
            vec2 startNdc = startClip.xy / startClip.w;
            vec2 endNdc = endClip.xy / endClip.w;
            vec2 screenDirection = (endNdc - startNdc) * resolution;
            float screenLength = max(length(screenDirection), 1.0e-6);
            vec2 perpendicular = vec2(-screenDirection.y, screenDirection.x) / screenLength;
            vec4 clipPoint = mix(startClip, endClip, position.x);
            vec2 ndcOffset = perpendicular * position.y * lineWidthPixels / resolution;
            clipPoint.xy += ndcOffset * clipPoint.w;
            gl_Position = clipPoint;
          }
        `,
        fragmentShader: `
          uniform vec3 lineColor;
          void main() { gl_FragColor = vec4(lineColor, 1.0); }
        `,
        depthTest: false,
        depthWrite: false,
        transparent: false,
      });
      const line = new THREE.Mesh(lineGeometry, lineMaterial);
      line.name = 'maximum_error_segment';
      line.renderOrder = 100;
      line.frustumCulled = false;
      roots.error.add(line);
      for (const [role, point, color] of [
        ['maximum_proxy_point', pair.proxy, 0xffb33c],
        ['maximum_source_point', pair.source, 0x43d6db],
      ]) {
        const markerGeometry = new THREE.BufferGeometry();
        markerGeometry.setAttribute('position', new THREE.Float32BufferAttribute(point, 3));
        const marker = new THREE.Points(markerGeometry, new THREE.ShaderMaterial({
          uniforms: { markerColor: { value: new THREE.Color(color) } },
          vertexShader: `
            void main() {
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              gl_PointSize = 18.0;
            }
          `,
          fragmentShader: `
            uniform vec3 markerColor;
            void main() {
              vec2 centered = gl_PointCoord - vec2(0.5);
              float radius = length(centered);
              if (radius > 0.5) discard;
              float edge = smoothstep(0.5, 0.42, radius);
              gl_FragColor = vec4(markerColor, edge);
            }
          `,
          depthTest: false,
          depthWrite: false,
          transparent: true,
        }));
        marker.name = role;
        marker.renderOrder = 101;
        marker.frustumCulled = false;
        roots.error.add(marker);
      }
    }

    async function fetchText(url) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${url}`);
      return response.text();
    }

    async function fetchArrayBuffer(url) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${url}`);
      return response.arrayBuffer();
    }

    async function fetchJson(url) {
      return JSON.parse(await fetchText(url));
    }

    function identityFromGroup(name) {
      const match = /^(?:region|primitive)_(\d+)_([a-z]+)$/.exec(name);
      return match ? { id: Number(match[1]), type: match[2] } : { id: null, type: null };
    }

    function parseOBJ(text, role) {
      const positions = [];
      const groups = [];
      let current = { name: role, indices: [], lines: [], points: [] };
      groups.push(current);
      for (const raw of text.split(/\r?\n/)) {
        const line = raw.trim();
        if (!line || line.startsWith('#')) continue;
        const fields = line.split(/\s+/);
        if (fields[0] === 'v' && fields.length >= 4) {
          positions.push(Number(fields[1]), Number(fields[2]), Number(fields[3]));
        } else if ((fields[0] === 'g' || fields[0] === 'o') && fields[1]) {
          if (current.indices.length === 0 && current.lines.length === 0 && current.points.length === 0 && current.name === role) current.name = fields[1];
          else {
            current = { name: fields[1], indices: [], lines: [], points: [] };
            groups.push(current);
          }
        } else if (fields[0] === 'f' && fields.length >= 4) {
          const count = positions.length / 3;
          const polygon = fields.slice(1).map(token => {
            const rawIndex = Number(token.split('/')[0]);
            return rawIndex > 0 ? rawIndex - 1 : count + rawIndex;
          });
          const triangles = triangulateObjFace(polygon, positions);
          triangles.forEach(triangle => current.indices.push(...triangle));
        } else if (fields[0] === 'l' && fields.length >= 3) {
          const count = positions.length / 3;
          const line = fields.slice(1).map(token => {
            const rawIndex = Number(token.split('/')[0]);
            return rawIndex > 0 ? rawIndex - 1 : count + rawIndex;
          });
          for (let index = 0; index + 1 < line.length; ++index)
            current.lines.push(line[index], line[index + 1]);
        } else if (fields[0] === 'p' && fields.length >= 2) {
          const count = positions.length / 3;
          for (const token of fields.slice(1)) {
            const rawIndex = Number(token.split('/')[0]);
            current.points.push(rawIndex > 0 ? rawIndex - 1 : count + rawIndex);
          }
        }
      }
      const populated = groups.filter(group => group.indices.length || group.lines.length || group.points.length);
      if (populated.length && populated.every(group => !group.indices.length && (group.lines.length || group.points.length))) {
        batchedPrimitiveData[role].clear();
        const objects = [];
        for (const group of populated) {
          const identity = identityFromGroup(group.name);
          if (group.lines.length) {
            const linePositions = [];
            for (const sourceIndex of group.lines) {
              linePositions.push(
                positions[3 * sourceIndex],
                positions[3 * sourceIndex + 1],
                positions[3 * sourceIndex + 2],
              );
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            geometry.computeBoundingBox();
            geometry.computeBoundingSphere();
            const material = new THREE.LineBasicMaterial({
              color: colorFor(identity.id || 0),
              depthTest: false,
              depthWrite: false,
              transparent: true,
              opacity: 1,
            });
            const lines = new THREE.LineSegments(geometry, material);
            lines.name = `${group.name}_edges`;
            lines.renderOrder = 50;
            lines.userData = { role, primitiveId: identity.id, primitiveType: identity.type };
            objects.push(lines);
          }
          if (group.points.length) {
            const pointPositions = [];
            for (const sourceIndex of group.points) {
              pointPositions.push(
                positions[3 * sourceIndex],
                positions[3 * sourceIndex + 1],
                positions[3 * sourceIndex + 2],
              );
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(pointPositions, 3));
            geometry.computeBoundingBox();
            geometry.computeBoundingSphere();
            const material = new THREE.PointsMaterial({
              color: colorFor(identity.id || 0),
              size: 7,
              sizeAttenuation: false,
              depthTest: false,
              depthWrite: false,
              transparent: true,
              opacity: 1,
            });
            const points = new THREE.Points(geometry, material);
            points.name = `${group.name}_points`;
            points.renderOrder = 51;
            points.userData = { role, primitiveId: identity.id, primitiveType: identity.type };
            objects.push(points);
          }
        }
        return objects;
      }
      const componentDiagnostic = populated.some(group =>
        identityFromGroup(group.name).type === 'component');
      if ((role === 'phase0' || role === 'phase1' || role === 'phase2' || role === 'phase3' || role === 'phase4') &&
          (populated.length > 2000 || componentDiagnostic)) {
        batchedPrimitiveData[role].clear();
        const buckets = new Map();
        for (const group of populated) {
          const identity = identityFromGroup(group.name);
          const key = identity.type || 'unknown';
          if (!buckets.has(key)) buckets.set(key, { positions: [], colors: [], primitiveIds: [] });
          const bucket = buckets.get(key);
          const color = colorFor(identity.id || 0);
          const primitivePositions = [];
          for (const sourceIndex of group.indices) {
            const triangleVertex = [
              positions[3 * sourceIndex], positions[3 * sourceIndex + 1], positions[3 * sourceIndex + 2],
            ];
            bucket.positions.push(...triangleVertex);
            bucket.colors.push(color.r, color.g, color.b);
            bucket.primitiveIds.push(identity.id ?? -1);
            primitivePositions.push(...triangleVertex);
          }
          if (identity.id !== null) batchedPrimitiveData[role].set(identity.id, {
            type: identity.type, positions: primitivePositions,
          });
        }
        return [...buckets.entries()].map(([type, bucket]) => {
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.Float32BufferAttribute(bucket.positions, 3));
          geometry.setAttribute('color', new THREE.Float32BufferAttribute(bucket.colors, 3));
          geometry.setAttribute('primitiveId', new THREE.Float32BufferAttribute(bucket.primitiveIds, 1));
          geometry.computeVertexNormals();
          geometry.computeBoundingBox();
          geometry.computeBoundingSphere();
          const material = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.68,
            metalness: 0.03,
            transparent: role === 'phase2',
            opacity: role === 'phase2' ? 0.72 : 1,
            depthWrite: role !== 'phase2', side: THREE.DoubleSide,
          });
          const mesh = new THREE.Mesh(geometry, material);
          if (role === 'phase4') attachTriangleWireframe(mesh);
          mesh.name = `batched_${type}`;
          mesh.userData = {
            role, primitiveId: null, primitiveType: type, batched: true,
          };
          return mesh;
        });
      }
      if (batchedPrimitiveData[role]) batchedPrimitiveData[role].clear();
      return populated.map(group => {
        const remap = new Map();
        const localPositions = [];
        const localIndices = [];
        for (const sourceIndex of group.indices) {
          let localIndex = remap.get(sourceIndex);
          if (localIndex === undefined) {
            localIndex = remap.size;
            remap.set(sourceIndex, localIndex);
            localPositions.push(
              positions[3 * sourceIndex],
              positions[3 * sourceIndex + 1],
              positions[3 * sourceIndex + 2],
            );
          }
          localIndices.push(localIndex);
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(localPositions, 3));
        geometry.setIndex(localIndices);
        geometry.computeVertexNormals();
        geometry.computeBoundingBox();
        geometry.computeBoundingSphere();
        const identity = identityFromGroup(group.name);
        let material;
        if (role === 'source') {
          material = new THREE.MeshStandardMaterial({ color: 0xb7bec2, roughness: 0.78, metalness: 0.02, side: THREE.DoubleSide });
        } else if (role === 'phase0') {
          material = new THREE.MeshStandardMaterial({
            color: 0xff9f32, roughness: 0.68, metalness: 0.03,
            side: THREE.DoubleSide,
          });
        } else {
          material = new THREE.MeshStandardMaterial({
            color: colorFor(identity.id || 0),
            roughness: 0.68,
            metalness: 0.03,
            transparent: role === 'phase2',
            opacity: role === 'phase2' ? 0.72 : 1,
            depthWrite: role !== 'phase2',
            side: THREE.DoubleSide,
          });
        }
        const mesh = new THREE.Mesh(geometry, material);
        if (role === 'phase4') {
          attachTriangleWireframe(mesh);
        }
        mesh.name = group.name;
        mesh.userData = { role, primitiveId: identity.id, primitiveType: identity.type };
        return mesh;
      });
    }

    function parseHalfedge(buffer, role, componentDiagnostic = false) {
      if (buffer.byteLength < 28) throw new Error('Halfedge file header is incomplete');
      const bytes = new Uint8Array(buffer);
      const magic = new TextDecoder('ascii').decode(bytes.subarray(0, 8));
      if (magic !== 'PQSSHED1') throw new Error(`Unknown Halfedge format ${magic}`);
      const view = new DataView(buffer);
      const vertexCount = view.getUint32(8, true);
      const faceCount = view.getUint32(12, true);
      const halfedgeCount = view.getUint32(16, true);
      const vertexHalfedgeCount = view.getUint32(20, true);
      const faceHalfedgeCount = view.getUint32(24, true);
      if (halfedgeCount !== faceCount * 3 || vertexHalfedgeCount !== vertexCount ||
          faceHalfedgeCount !== faceCount) throw new Error('Halfedge array counts are inconsistent');
      const expected = 28 + vertexCount * 24 + faceCount * 12 +
        halfedgeCount * 16 + vertexHalfedgeCount * 4 + faceHalfedgeCount * 4;
      if (buffer.byteLength !== expected) throw new Error('Halfedge payload size is inconsistent');
      let offset = 28;
      const precisePositions = new Float64Array(vertexCount * 3);
      const localOrigin = new THREE.Vector3();
      for (let index = 0; index < precisePositions.length; ++index, offset += 8) {
        precisePositions[index] = view.getFloat64(offset, true);
        localOrigin.setComponent(index % 3,
          localOrigin.getComponent(index % 3) + precisePositions[index] / vertexCount);
      }
      const positions = new Float32Array(vertexCount * 3);
      for (let index = 0; index < positions.length; ++index)
        positions[index] = precisePositions[index] - localOrigin.getComponent(index % 3);
      const indices = new Uint32Array(faceCount * 3);
      for (let index = 0; index < indices.length; ++index, offset += 4) {
        indices[index] = view.getUint32(offset, true);
        if (indices[index] >= vertexCount) throw new Error('Halfedge face has an invalid vertex');
      }
      const halfedges = new Uint32Array(halfedgeCount * 4);
      for (let index = 0; index < halfedges.length; ++index, offset += 4)
        halfedges[index] = view.getUint32(offset, true);
      const vertexHalfedges = new Uint32Array(vertexHalfedgeCount);
      for (let index = 0; index < vertexHalfedges.length; ++index, offset += 4)
        vertexHalfedges[index] = view.getUint32(offset, true);
      const faceHalfedges = new Uint32Array(faceHalfedgeCount);
      for (let index = 0; index < faceHalfedges.length; ++index, offset += 4)
        faceHalfedges[index] = view.getUint32(offset, true);
      if (!componentDiagnostic) {
        halfedgeInspections[role] = {
        positions: precisePositions, localOrigin, indices, halfedges,
        vertexHalfedges, faceHalfedges, vertexCount, faceCount, halfedgeCount,
        };
        if (role === inspectionRole) halfedgeInspection = halfedgeInspections[role];
      }
      if (componentDiagnostic) {
        const opposites = new Uint32Array(halfedgeCount);
        for (let index = 0; index < halfedgeCount; ++index)
          opposites[index] = halfedges[index * 4 + 3];
        const visited = new Uint8Array(faceCount);
        const components = [];
        for (let seed = 0; seed < faceCount; ++seed) {
          if (visited[seed]) continue;
          const faces = [];
          const queue = [seed];
          visited[seed] = 1;
          let area = 0;
          for (let cursor = 0; cursor < queue.length; ++cursor) {
            const face = queue[cursor];
            faces.push(face);
            const ia = indices[3 * face], ib = indices[3 * face + 1], ic = indices[3 * face + 2];
            const ax = positions[3 * ia], ay = positions[3 * ia + 1], az = positions[3 * ia + 2];
            const ux = positions[3 * ib] - ax, uy = positions[3 * ib + 1] - ay, uz = positions[3 * ib + 2] - az;
            const vx = positions[3 * ic] - ax, vy = positions[3 * ic + 1] - ay, vz = positions[3 * ic + 2] - az;
            const cx = uy * vz - uz * vy, cy = uz * vx - ux * vz, cz = ux * vy - uy * vx;
            area += 0.5 * Math.hypot(cx, cy, cz);
            for (let local = 0; local < 3; ++local) {
              const opposite = opposites[3 * face + local];
              if (opposite === 0xffffffff) continue;
              const neighbor = Math.floor(opposite / 3);
              if (!visited[neighbor]) { visited[neighbor] = 1; queue.push(neighbor); }
            }
          }
          components.push({ faces, area, minimumFace: Math.min(...faces) });
        }
        components.sort((a, b) => b.area - a.area || a.minimumFace - b.minimumFace);
        const diagnosticPositions = [];
        const colors = [];
        const primitiveIds = [];
        batchedPrimitiveData[role].clear();
        components.forEach((component, id) => {
          const color = colorFor(id);
          const selectedPositions = [];
          for (const face of component.faces) for (let local = 0; local < 3; ++local) {
            const vertex = indices[3 * face + local];
            const point = [positions[3 * vertex], positions[3 * vertex + 1], positions[3 * vertex + 2]];
            diagnosticPositions.push(...point);
            selectedPositions.push(...point);
            colors.push(color.r, color.g, color.b);
            primitiveIds.push(id);
          }
          batchedPrimitiveData[role].set(id, { type: 'component', positions: selectedPositions });
        });
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(diagnosticPositions, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geometry.setAttribute('primitiveId', new THREE.Float32BufferAttribute(primitiveIds, 1));
        geometry.computeVertexNormals();
        geometry.computeBoundingBox();
        geometry.computeBoundingSphere();
        const material = new THREE.MeshStandardMaterial({
          vertexColors: true, roughness: 0.66, metalness: 0.04, side: THREE.DoubleSide,
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.copy(localOrigin);
        mesh.name = 'batched_component_diagnostic';
        mesh.userData = { role, primitiveId: null, primitiveType: 'component', batched: true };
        return [mesh];
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setIndex(new THREE.BufferAttribute(indices, 1));
      geometry.computeVertexNormals();
      geometry.computeBoundingBox();
      geometry.computeBoundingSphere();
      const material = new THREE.MeshStandardMaterial({
        color: 0x42b892, roughness: 0.66, metalness: 0.04, side: THREE.DoubleSide,
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(localOrigin);
      mesh.name = `${role}_halfedge`;
      mesh.userData = { role, halfedge: true, vertexCount, faceCount, halfedgeCount };
      return [mesh];
    }

    function triangulateObjFace(polygon, positions) {
      if (polygon.length === 3) return [[polygon[0], polygon[1], polygon[2]]];
      const point = index => new THREE.Vector3(
        positions[3 * index], positions[3 * index + 1], positions[3 * index + 2],
      );
      const normal = new THREE.Vector3();
      for (let index = 0; index < polygon.length; index++) {
        const current = point(polygon[index]);
        const next = point(polygon[(index + 1) % polygon.length]);
        normal.x += (current.y - next.y) * (current.z + next.z);
        normal.y += (current.z - next.z) * (current.x + next.x);
        normal.z += (current.x - next.x) * (current.y + next.y);
      }
      const droppedAxis = Math.abs(normal.x) >= Math.abs(normal.y) && Math.abs(normal.x) >= Math.abs(normal.z)
        ? 0 : (Math.abs(normal.y) >= Math.abs(normal.z) ? 1 : 2);
      const projected = polygon.map(index => {
        const p = point(index);
        return droppedAxis === 0 ? [p.y, p.z] : (droppedAxis === 1 ? [p.x, p.z] : [p.x, p.y]);
      });
      const cross = (a, b, c) => (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      const signedArea = projected.reduce((sum, p, index) => {
        const q = projected[(index + 1) % projected.length];
        return sum + p[0] * q[1] - q[0] * p[1];
      }, 0);
      const inside = (p, a, b, c) => {
        const first = cross(a, b, p), second = cross(b, c, p), third = cross(c, a, p);
        return (first >= -1e-12 && second >= -1e-12 && third >= -1e-12)
          || (first <= 1e-12 && second <= 1e-12 && third <= 1e-12);
      };
      const remaining = polygon.map((_, index) => index);
      const result = [];
      while (remaining.length > 3) {
        let clipped = false;
        for (let offset = 0; offset < remaining.length; offset++) {
          const previous = remaining[(offset + remaining.length - 1) % remaining.length];
          const current = remaining[offset];
          const next = remaining[(offset + 1) % remaining.length];
          const turn = cross(projected[previous], projected[current], projected[next]);
          if ((signedArea > 0 && turn <= 1e-12) || (signedArea < 0 && turn >= -1e-12)) continue;
          if (remaining.some(candidate => candidate !== previous && candidate !== current
            && candidate !== next && inside(projected[candidate], projected[previous],
              projected[current], projected[next]))) continue;
          result.push([polygon[previous], polygon[current], polygon[next]]);
          remaining.splice(offset, 1);
          clipped = true;
          break;
        }
        if (!clipped) throw new Error('图元 OBJ 包含无法三角化的多边形');
      }
      result.push(remaining.map(index => polygon[index]));
      return result;
    }

    function disposeRoot(root) {
      for (const child of [...root.children]) {
        root.remove(child);
        child.traverse(object => {
          if (!object.userData.sharedGeometry) object.geometry?.dispose();
          const materials = Array.isArray(object.material)
            ? object.material : [object.material];
          for (const material of materials) material?.dispose?.();
        });
      }
      root.position.set(0, 0, 0);
    }

    function addMeshes(root, meshes) { meshes.forEach(mesh => root.add(mesh)); }

    function removeSelectionOverlays(root) {
      for (const child of [...root.children]) {
        if (!child.userData.selectionOverlay) continue;
        root.remove(child);
        child.traverse(object => {
          object.geometry?.dispose();
          object.material?.dispose();
        });
      }
    }

    function createSelectionOverlay(role, primitiveId) {
      const data = batchedPrimitiveData[role].get(Number(primitiveId));
      if (!data) return null;
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(data.positions, 3));
      geometry.computeVertexNormals();
      geometry.computeBoundingBox();
      geometry.computeBoundingSphere();
      const material = new THREE.MeshStandardMaterial({
        color: colorFor(Number(primitiveId)), roughness: 0.66, metalness: 0.04,
        side: THREE.DoubleSide,
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = `selected_${primitiveId}_${data.type}`;
      mesh.userData = {
        role, primitiveId: Number(primitiveId), primitiveType: data.type,
        selectionOverlay: true,
      };
      if (role === 'phase4') attachTriangleWireframe(mesh);
      return mesh;
    }

    function syncSelectionOverlays() {
      for (const role of ['phase3', 'phase4']) {
        const root = roots[role];
        removeSelectionOverlays(root);
        if (selectedPrimitive === 'all') continue;
        const overlay = createSelectionOverlay(role, selectedPrimitive);
        if (overlay) root.add(overlay);
      }
    }

    function availablePrimitiveIds() {
      const records = metadata?.proxy_components || metadata?.primitive_records || [];
      return new Set(records.map(record => String(record.id)));
    }

    function setPrimitiveSelection(value, { updateUi = true } = {}) {
      const requested = String(value);
      selectedPrimitive = requested === 'all' || availablePrimitiveIds().has(requested)
        ? requested
        : 'all';
      if (updateUi) primitiveSelect.value = selectedPrimitive;
      syncSelectionOverlays();
      updateVisibility();
      updatePrimitiveStats();
      applyMaterialControls();
    }

    function resetPrimitiveSelection() {
      selectedPrimitive = 'all';
      primitiveSelect.value = 'all';
      removeSelectionOverlays(roots.phase3);
      removeSelectionOverlays(roots.phase4);
      updateVisibility();
      updatePrimitiveStats();
      applyMaterialControls();
    }

    function applyMaterialControls() {
      const opacity = Number(document.querySelector('#opacity').value) / 100;
      const otherOpacity = Number(document.querySelector('#otherOpacity').value) / 100;
      const wireframe = document.querySelector('#wireframe').checked;
      for (const role of ['phase0', 'phase1', 'phase2', 'phase3']) roots[role].children.forEach(mesh => {
        if (mesh.isLineSegments || mesh.isPoints) {
          mesh.visible = visiblePrimitive(mesh);
          mesh.material.opacity = 1;
          mesh.material.transparent = false;
          mesh.material.depthTest = false;
          mesh.material.depthWrite = false;
          mesh.renderOrder = mesh.isPoints ? 51 : 50;
          return;
        }
        const selected = mesh.userData.selectionOverlay || selectedPrimitive === 'all' ||
          mesh.userData.primitiveId === Number(selectedPrimitive);
        const meshOpacity = mesh.userData.batched && selectedPrimitive !== 'all'
          ? otherOpacity : (selected ? opacity : otherOpacity);
        const occludedWireframe = wireframe
          ? ensureOccludedWireframe(mesh)
          : mesh.children.find(child => child.userData.occludedWireframe);
        mesh.material.wireframe = false;
        mesh.material.colorWrite = !wireframe;
        mesh.material.opacity = wireframe ? 1 : meshOpacity;
        mesh.material.transparent = wireframe ? false : meshOpacity < 1;
        mesh.material.depthWrite = wireframe ? true : meshOpacity >= 1;
        mesh.material.depthTest = true;
        if (occludedWireframe) {
          occludedWireframe.visible = wireframe;
          occludedWireframe.material.opacity = Math.max(meshOpacity, 0.72);
          occludedWireframe.material.transparent = true;
          occludedWireframe.material.depthTest = true;
          occludedWireframe.material.depthWrite = false;
        }
        mesh.renderOrder = selected ? 2 : 0;
      });
      roots.phase4.children.forEach(mesh => {
        const selected = mesh.userData.selectionOverlay || selectedPrimitive === 'all' ||
          mesh.userData.primitiveId === Number(selectedPrimitive);
        const meshOpacity = mesh.userData.batched && selectedPrimitive !== 'all'
          ? otherOpacity : (selected ? opacity : otherOpacity);
        const displayedOpacity = mode === 'error' ? Math.min(meshOpacity, 0.58) : meshOpacity;
        mesh.material.opacity = displayedOpacity;
        mesh.material.transparent = displayedOpacity < 1;
        mesh.material.depthWrite = displayedOpacity >= 1;
        mesh.material.wireframe = false;
        mesh.renderOrder = selected ? 2 : 0;
        mesh.children.forEach(child => {
          if (!child.userData.triangleWireframe) return;
          child.material.opacity = selected
            ? Math.max(meshOpacity, 0.55)
            : Math.min(meshOpacity, 0.35);
          child.material.transparent = child.material.opacity < 1;
        });
      });
      roots.source.children.forEach(mesh => {
        const meshOpacity = mode === 'error' ? 0.24 : 1;
        const occludedWireframe = wireframe
          ? ensureOccludedWireframe(mesh)
          : mesh.children.find(child => child.userData.occludedWireframe);
        mesh.material.wireframe = false;
        mesh.material.colorWrite = !wireframe;
        mesh.material.opacity = wireframe ? 1 : meshOpacity;
        mesh.material.transparent = wireframe ? false : meshOpacity < 1;
        mesh.material.depthTest = true;
        mesh.material.depthWrite = wireframe ? true : meshOpacity >= 1;
        if (occludedWireframe) {
          occludedWireframe.visible = wireframe;
          occludedWireframe.material.opacity = Math.max(meshOpacity, 0.72);
          occludedWireframe.material.transparent = true;
          occludedWireframe.material.depthTest = true;
          occludedWireframe.material.depthWrite = false;
        }
      });
      if (mode === 'error') roots.phase1.children.forEach(mesh => {
        mesh.material.opacity = 0.24;
        mesh.material.transparent = true;
        mesh.material.depthWrite = false;
      });
      if (wireframe) {
        for (const role of ['phase0', 'phase1', 'phase2', 'phase3']) {
          roots[role].children.forEach(mesh => {
            if (mesh.isLineSegments || mesh.isPoints) {
              mesh.visible = visiblePrimitive(mesh);
              mesh.material.opacity = 1;
              mesh.material.transparent = false;
              mesh.material.depthTest = false;
              mesh.material.depthWrite = false;
              mesh.renderOrder = mesh.isPoints ? 51 : 50;
              return;
            }
            mesh.material.colorWrite = false;
            mesh.material.transparent = false;
            mesh.material.opacity = 1;
            mesh.material.depthTest = true;
            mesh.material.depthWrite = true;
          });
        }
      }
      renderDirty = true;
    }

    function setLoading(message) {
      loadingText.id = 'loadingText';
      loadingText.textContent = message;
      loading.classList.remove('hidden');
    }

    function showError(error) {
      loadingText.id = 'error';
      loadingText.textContent = `无法加载代理模型\n${error.message || error}`;
      loading.classList.remove('hidden');
    }

    function visiblePrimitive(mesh) {
      const typeAllowed = !mesh.userData.primitiveType ||
        mesh.userData.primitiveType === 'component' ||
        enabledTypes.has(mesh.userData.primitiveType);
      if (mesh.userData.selectionOverlay)
        return typeAllowed && selectedPrimitive !== 'all' &&
          mesh.userData.primitiveId === Number(selectedPrimitive);
      const selected = selectedPrimitive === 'all' ||
        mesh.userData.primitiveId === Number(selectedPrimitive);
      const contextVisible = selected || Number(document.querySelector('#otherOpacity').value) > 0;
      return typeAllowed && contextVisible;
    }

    function updateVisibility() {
      const comparisonRoot = roots.phase4.children.length ? roots.phase4
        : roots.phase3.children.length ? roots.phase3
        : roots.phase2.children.length ? roots.phase2
        : roots.phase1.children.length ? roots.phase1 : roots.phase0;
      roots.source.visible = mode === 'source' || mode === 'split';
      roots.phase0.visible = mode === 'phase0' ||
        (mode === 'split' && comparisonRoot === roots.phase0);
      const concavityDiagnostic = Boolean(metadata?.stats?.phase2_concavity);
      roots.phase1.visible = mode === 'phase1' || mode === 'error' ||
        (concavityDiagnostic && mode === 'phase3') ||
        (mode === 'split' && comparisonRoot === roots.phase1);
      roots.phase2.visible = mode === 'phase2' ||
        (mode === 'split' && comparisonRoot === roots.phase2);
      roots.phase3.visible = mode === 'phase3' ||
        (mode === 'split' && comparisonRoot === roots.phase3);
      roots.phase4.visible = (mode === 'phase4' || mode === 'split' || mode === 'error') &&
        comparisonRoot === roots.phase4;
      roots.error.visible = mode === 'error';
      roots.phase2.children.forEach(mesh => { mesh.visible = visiblePrimitive(mesh); });
      roots.phase3.children.forEach(mesh => { mesh.visible = visiblePrimitive(mesh); });
      roots.phase4.children.forEach(mesh => { mesh.visible = visiblePrimitive(mesh); });
      roots.source.position.set(0, 0, 0);
      roots.phase0.position.set(0, 0, 0);
      roots.phase1.position.set(0, 0, 0);
      roots.phase2.position.set(0, 0, 0);
      roots.phase3.position.set(0, 0, 0);
      roots.phase4.position.set(0, 0, 0);
      roots.error.position.set(0, 0, 0);
      labels.classList.toggle('visible', mode === 'split');

      if (mode === 'split') {
        const box = new THREE.Box3().setFromObject(roots.source);
        const size = box.getSize(new THREE.Vector3());
        const axis = size.x >= size.y ? 'x' : 'y';
        const gap = Math.max(size.x, size.y, size.z) * 0.18;
        const shift = 0.5 * (size[axis] + gap);
        roots.source.position[axis] = -shift;
        comparisonRoot.position[axis] = shift;
      }
      renderDirty = true;
    }

    function fitView() {
      updateVisibility();
      const box = new THREE.Box3();
      for (const root of Object.values(roots)) if (root.visible) box.expandByObject(root);
      if (box.isEmpty()) return;
      const center = box.getCenter(new THREE.Vector3());
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      const radius = Math.max(sphere.radius, 1e-6);
      const topbarBox = document.querySelector('#topbar').getBoundingClientRect();
      const panelBox = document.querySelector('#panel').getBoundingClientRect();
      const safe = { left: 12, top: topbarBox.bottom + 12, right: innerWidth - 12, bottom: innerHeight - 12 };
      if (panelBox.width > innerWidth * 0.7) safe.bottom = panelBox.top - 12;
      else safe.right = panelBox.left - 12;
      const safeWidth = Math.max(safe.right - safe.left, 80);
      const safeHeight = Math.max(safe.bottom - safe.top, 80);
      const safeCenterX = safe.left + safeWidth * 0.5;
      const safeCenterY = safe.top + safeHeight * 0.5;
      const direction = new THREE.Vector3(1.25, -1.55, 1.05).normalize();
      const tangentHalfVertical = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
      const tangentHalfSafe = tangentHalfVertical *
        Math.min(safeWidth, safeHeight) / innerHeight;
      const safeHalfAngle = Math.atan(Math.max(tangentHalfSafe, 1e-6));
      const distance = radius / Math.sin(safeHalfAngle) * 1.12;
      const worldPerPixel = 2 * distance * tangentHalfVertical / innerHeight;
      const screenRight = new THREE.Vector3().crossVectors(camera.up, direction).normalize();
      const screenUp = new THREE.Vector3().crossVectors(direction, screenRight).normalize();
      const viewOffset = screenRight.multiplyScalar((innerWidth * 0.5 - safeCenterX) * worldPerPixel)
        .addScaledVector(screenUp, (safeCenterY - innerHeight * 0.5) * worldPerPixel);
      const viewCenter = center.clone().add(viewOffset);
      camera.position.copy(viewCenter).addScaledVector(direction, distance);
      camera.near = Math.max(distance / 10000, 1e-6);
      camera.far = Math.max(distance * 100, 1000);
      camera.updateProjectionMatrix();
      controls.target.copy(viewCenter);
      controls.update();
      fitPending = false;
    }

    function statRow(label, value, className = '', target = statsElement) {
      const dt = document.createElement('dt');
      dt.textContent = label;
      const dd = document.createElement('dd');
      dd.textContent = value;
      if (className) dd.className = className;
      target.append(dt, dd);
    }

    function phase2RoundRecord(index = currentPhase2Round) {
      if (!Number.isInteger(index) || index < 0 || index >= phase2RoundRecords.length)
        return null;
      return phase2RoundRecords[index];
    }

    function updatePhase2RoundUi() {
      const section = document.querySelector('#phase2RoundSection');
      const stats = document.querySelector('#phase2RoundStats');
      section.hidden = phase2RoundRecords.length === 0;
      stats.replaceChildren();
      if (!phase2RoundRecords.length) return;
      const record = phase2RoundRecord();
      statRow('当前轮次', record ? `${currentPhase2Round} / ${phase2RoundRecords.length - 1}` : '-', '', stats);
      statRow('累计移动点', record ? Number(record.cumulative_moved_vertices).toLocaleString() : '-', '', stats);
      statRow('共面合并评分', record ? Number(record.scored_coplanar_triangles).toLocaleString() : '-', '', stats);
      statRow('是否选中', record?.selected ? '是' : '否', record?.selected ? 'valid' : '', stats);
      document.querySelector('#previousPhase2RoundButton').disabled =
        !Number.isInteger(currentPhase2Round) || currentPhase2Round <= 0;
      document.querySelector('#nextPhase2RoundButton').disabled =
        !Number.isInteger(currentPhase2Round) ||
        currentPhase2Round + 1 >= phase2RoundRecords.length;
    }

    async function setPhase2Round(index) {
      if (!Number.isInteger(index) || index < 0 || index >= phase2RoundRecords.length)
        return;
      const record = phase2RoundRecords[index];
      if (!record?.halfedge || !currentMetadataUrl) return;
      setLoading(`正在加载阶段 2 第 ${index} 轮...`);
      try {
        const key = `${currentMetadataUrl.href}#phase2_round_${index}`;
        let buffer = phase2RoundCache.get(key);
        if (!buffer) {
          buffer = await fetchArrayBuffer(new URL(record.halfedge, currentMetadataUrl));
          phase2RoundCache.set(key, buffer);
        }
        disposeRoot(roots.phase2);
        addMeshes(roots.phase2, parseHalfedge(buffer, 'phase2'));
        currentPhase2Round = index;
        params.set('round', String(index));
        params.set('stage', 'phase2');
        history.replaceState(null, '', `${location.pathname}?${params}`);
        setMode('phase2');
        updatePhase2RoundUi();
        applyMaterialControls();
      } finally {
        loading.classList.add('hidden');
      }
    }

    function secondsValue(value) {
      const number = Number(value);
      return Number.isFinite(number) ? `${number.toFixed(3)} 秒` : '-';
    }

    function scalarValue(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '-';
      if (number === 0) return '0';
      return number.toPrecision(6);
    }

    function percentValue(value) {
      const number = Number(value);
      return Number.isFinite(number) ? `${(number * 100).toPrecision(5)}%` : '-';
    }

    function updatePrimitiveStats() {
      primitiveStatsElement.replaceChildren();
      if (selectedPrimitive === 'all') {
        statRow('选择', '全部代理部件', '', primitiveStatsElement);
        return;
      }
      const records = metadata.proxy_components || metadata.primitive_records || [];
      const record = records.find(item => Number(item.id) === Number(selectedPrimitive));
      if (!record) return;
      statRow('编号', `#${record.id}`, '', primitiveStatsElement);
      statRow('类型', primitiveTypeNames[record.type] || record.type, '', primitiveStatsElement);
      if (record.type === 'polygon') statRow('边界顶点', Number(record.vertex_count).toLocaleString(), '', primitiveStatsElement);
      statRow('三角化面数', Number(record.triangulated_face_count).toLocaleString(), '', primitiveStatsElement);
      if (record.type === 'component') {
        statRow('面积', scalarValue(record.area), '', primitiveStatsElement);
        statRow('面积占比', percentValue(record.area_fraction), '', primitiveStatsElement);
        statRow('未配对半边', Number(record.boundary_halfedges).toLocaleString(), '', primitiveStatsElement);
      }
    }

    function updateMetadata() {
      const s = metadata.stats;
      statsElement.replaceChildren();
      statRow('原始三角形数', Number(s.source_triangles).toLocaleString());
      statRow('图元数', Number(s.primitive_count).toLocaleString());
      if (Number.isFinite(Number(s.proxy_triangles)))
        statRow('三角化后三角形数', Number(s.proxy_triangles).toLocaleString());
      if (s.topology_fill?.representation) {
        statRow('阶段 1 表示', '冻结 halfedge');
        statRow('占据体素', Number(s.topology_fill.output_voxels).toLocaleString());
        statRow('边界体素', Number(s.topology_fill.boundary_voxels).toLocaleString());
      }
      statRow('耗时', secondsValue(s.timings_seconds?.total));
      const containment = s.containment_validation;
      if (containment) statRow('严格包围验证', containment.passed ? '通过' : '失败',
        containment.passed ? 'valid' : 'invalid');
      const error = s.simplification_error || s.open_region_error;
      if (error) {
        statRow('最大误差上限', scalarValue(error.maximum_distance_limit));
        statRow('平均误差', scalarValue(error.mean_distance));
        statRow(error.maximum_is_certified_upper_bound ? '认证误差上界' : '最大误差',
          scalarValue(error.maximum_distance));
        if (Number.isFinite(Number(error.observed_lower_bound)))
          statRow('最大观测误差', scalarValue(error.observed_lower_bound));
        statRow('误差统计耗时', secondsValue(error.seconds));
      }
      updatePhase2RoundUi();
      document.querySelector('#errorSection').hidden = !error;
      const declaredStages = new Set(metadata.viewer_stages || [
        'source', 'phase0', 'phase1', 'phase2', 'phase3', 'phase4', 'split',
      ]);
      document.querySelector('[data-mode="phase0"]').textContent = '阶段 0：原始 OBJ 开放洞覆盖';
      document.querySelector('[data-mode="phase1"]').textContent = '阶段 1：填洞结果';
      document.querySelector('[data-mode="phase2"]').textContent = '阶段 2：保守外扩';
      for (const stage of ['source', 'phase0', 'phase1', 'phase2', 'phase3', 'phase4', 'split']) {
        const button = document.querySelector(`[data-mode="${stage}"]`);
        button.hidden = !declaredStages.has(stage);
        button.disabled = !declaredStages.has(stage);
      }
      document.querySelector('#comparisonLabel').textContent = declaredStages.has('phase4')
        ? '阶段 4：三角化结果'
        : declaredStages.has('phase3')
          ? '阶段 3：面数最小化结果'
          : declaredStages.has('phase2')
            ? '阶段 2：保守外扩结果'
            : declaredStages.has('phase1')
              ? '阶段 1：填洞结果'
              : '阶段 0：原始 OBJ 开放洞覆盖';
      document.querySelector('#sourceComparisonLabel').textContent =
        metadata.comparison_source_label || '原模型';
      const errorButton = document.querySelector('[data-mode="error"]');
      errorButton.hidden = !error || !declaredStages.has('error');
      errorButton.disabled = errorButton.hidden;
      document.querySelector('#focusErrorButton').disabled =
        !error || !(Number(error.maximum_distance) > 0);
      if (error && Number.isFinite(Number(error.maximum_distance_limit))) {
        maximumErrorInput.value = String(Number(error.maximum_distance_limit));
        maximumErrorInput.dataset.defaultValue = maximumErrorInput.value;
      }

      primitiveSelect.replaceChildren(new Option('全部代理部件', 'all'));
      const records = metadata.proxy_components || metadata.primitive_records || [];
      const optionFragment = document.createDocumentFragment();
      for (const record of records) {
        optionFragment.append(new Option(
          `#${record.id}  ${primitiveTypeNames[record.type] || record.type}`,
          String(record.id),
        ));
      }
      primitiveSelect.append(optionFragment);

      document.querySelectorAll('[data-type]').forEach(input => {
        input.closest('label').hidden = !Object.prototype.hasOwnProperty.call(s.primitive_types, input.dataset.type);
      });
    }

    async function loadModel(modelId, options = {}) {
      const generation = ++loadGeneration;
      window.__viewerLoadStage = 'metadata';
      resetPrimitiveSelection();
      clearHalfedgeInspection();
      halfedgeInspection = null;
      halfedgeInspections.phase1 = null;
      halfedgeInspections.phase2 = null;
      setLoading(`正在加载模型 ${modelId}...`);
      const requestedModel = manifest.models.find(
        model => Number(model.id) === Number(modelId));
      if (!requestedModel) throw new Error(`清单中不存在模型 ${modelId}`);
      const metadataUrl = new URL(
        options.metadata || requestedModel.metadata, manifestUrl);
      const loadedMetadata = await fetchJson(metadataUrl);
      window.__viewerLoadStage = 'assets';
      const declaredStages = new Set(loadedMetadata.viewer_stages || [
        'source', 'phase0', 'phase1', 'phase2', 'phase3', 'phase4', 'split',
      ]);
      const hasPhase1 = declaredStages.has('phase1');
      const halfedgePhase1 = hasPhase1 && Boolean(loadedMetadata.phase1_halfedge);
      const halfedgePhase2 = declaredStages.has('phase2') &&
        Boolean(loadedMetadata.phase2_halfedge);
      if (hasPhase1 && !halfedgePhase1) {
        throw new Error('阶段 1 缺少正式 phase1_halfedge.bin');
      }
      const diagnosticHalfedge = Boolean(loadedMetadata.diagnostic_halfedge);
      const [sourceText, phase0Text, phase1Data, phase2Data, phase3Text, phase4Text, errorData] = await Promise.all([
        fetchText(new URL(loadedMetadata.source, metadataUrl)),
        declaredStages.has('phase0')
          ? fetchText(new URL(
              loadedMetadata.phase0_combined ||
                loadedMetadata.phase0_caps || loadedMetadata.phase0,
              metadataUrl))
          : Promise.resolve(null),
        halfedgePhase1
          ? fetchArrayBuffer(new URL(loadedMetadata.phase1_halfedge, metadataUrl))
          : Promise.resolve(null),
        declaredStages.has('phase2')
          ? halfedgePhase2
            ? fetchArrayBuffer(new URL(loadedMetadata.phase2_halfedge, metadataUrl))
            : fetchText(new URL(
                loadedMetadata.phase2_recognized_surfaces ||
                  loadedMetadata.primitive_analysis || loadedMetadata.proxy, metadataUrl))
          : Promise.resolve(null),
        declaredStages.has('phase3')
          ? diagnosticHalfedge
            ? fetchArrayBuffer(new URL(loadedMetadata.diagnostic_halfedge, metadataUrl))
            : fetchText(new URL(
              loadedMetadata.phase3_simplified_surfaces ||
                loadedMetadata.primitive_analysis || loadedMetadata.proxy, metadataUrl))
          : Promise.resolve(null),
        declaredStages.has('phase4')
          ? fetchText(new URL(
              loadedMetadata.phase4_triangulated ||
                loadedMetadata.triangulated_proxy || loadedMetadata.proxy, metadataUrl))
          : Promise.resolve(null),
        loadedMetadata.open_error_visualization && declaredStages.has('error')
          ? fetchJson(new URL(loadedMetadata.open_error_visualization, metadataUrl))
          : Promise.resolve(null),
      ]);
      window.__viewerLoadStage = 'parse-source';
      if (generation !== loadGeneration) return;
      currentModel = requestedModel;
      metadata = loadedMetadata;
      currentMetadataUrl = metadataUrl;
      phase2RoundCache = new Map();
      phase2RoundRecords = Array.isArray(loadedMetadata.stats?.phase2?.rounds)
        ? loadedMetadata.stats.phase2.rounds
        : [];
      currentPhase2Round = phase2RoundRecords.length
        ? Number(loadedMetadata.stats?.phase2?.selected_round ?? 0)
        : null;
      Object.values(roots).forEach(disposeRoot);
      addMeshes(roots.source, parseOBJ(sourceText, 'source'));
      if (phase0Text) addMeshes(roots.phase0, parseOBJ(phase0Text, 'phase0'));
      window.__viewerLoadStage = 'parse-diagnostic';
      if (halfedgePhase1) addMeshes(roots.phase1, parseHalfedge(phase1Data, 'phase1'));
      if (phase2Data) addMeshes(roots.phase2, halfedgePhase2
        ? parseHalfedge(phase2Data, 'phase2')
        : parseOBJ(phase2Data, 'phase2'));
      if (phase3Text) addMeshes(roots.phase3, diagnosticHalfedge
        ? parseHalfedge(phase3Text, 'phase3', true)
        : parseOBJ(phase3Text, 'phase3'));
      if (phase4Text) addMeshes(roots.phase4, parseOBJ(phase4Text, 'phase4'));
      window.__viewerLoadStage = 'fit';
      addOpenErrorVisualization(errorData);
      const requestedInspection = params.get('inspect') === 'phase2' &&
        halfedgeInspections.phase2 ? 'phase2' : halfedgeInspections.phase1
          ? 'phase1' : halfedgeInspections.phase2 ? 'phase2' : 'phase1';
      setInspectionRole(requestedInspection, false);
      const requestedMode = params.get('stage');
      if (['source', 'phase0', 'phase1', 'phase2', 'phase3', 'phase4', 'split', 'error'].includes(requestedMode))
        setMode(requestedMode);
      const requestedRound = Number(params.get('round'));
      if (phase2RoundRecords.length && Number.isInteger(requestedRound) &&
          requestedRound >= 0 && requestedRound < phase2RoundRecords.length) {
        await setPhase2Round(requestedRound);
      }
      document.querySelector('#inspectionStage').querySelector(
        'option[value="phase1"]').disabled = !halfedgeInspections.phase1;
      document.querySelector('#inspectionStage').querySelector(
        'option[value="phase2"]').disabled = !halfedgeInspections.phase2;
      const requestedHalfedge = Number(params.get('halfedge'));
