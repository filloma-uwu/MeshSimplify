[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pqss-proxy-mesh"
version = "0.1.0"
description = "Conservative proxy mesh generation for PQSS model pools"
requires-python = ">=3.11"
dependencies = [
    "manifold3d>=3.3",
    "numpy>=2.0",
    "pillow>=11.0",
    "scipy>=1.14",
    "scikit-image>=0.26",
    "shapely>=2.1",
    "trimesh>=4.10",
]

[project.scripts]
pqss-proxy-generate = "pqss_proxy_mesh.cli:main"
pqss-proxy-primitives = "pqss_proxy_mesh.primitive_cli:main"
pqss-primitive-analyze = "pqss_proxy_mesh.primitive_analysis_cli:main"
pqss-primitive-bvh-export = "pqss_proxy_mesh.primitive_bvh_export:main"
pqss-primitive-clean = "pqss_proxy_mesh.primitive_cleanup:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
